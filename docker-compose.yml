services:

  # ─────────────────────────────────────────────
  # 1. PostgreSQL Database
  # ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: bankofmvp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bankofmvp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bankofmvp"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - banknet

  # ─────────────────────────────────────────────
  # 2. Express Backend API
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bankofmvp-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bankofmvp
      JWT_SECRET: super_secret_bankofmvp_jwt_key_change_in_production
    ports:
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - banknet

  # ─────────────────────────────────────────────
  # 3. React Frontend (nginx)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bankofmvp-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - banknet

# ─────────────────────────────────────────────
# Volumes & Networks
# ─────────────────────────────────────────────
volumes:
  pgdata:

networks:
  banknet:
    driver: bridge
